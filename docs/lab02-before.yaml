        Ref: SaasWebVpcPrivateAppSubnet1SubnetC411CFA1
      Tags:
        - Key: Name
          Value: Lab02Stack/WebInstance
      UserData:
        Fn::Base64: |-
          #!/bin/bash
          mkdir -p /opt/lab02
          cat > /opt/lab02/server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          import socket

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      body = {"status": "ok"}
                  else:
                      body = {
                          "message": "Hello from Lab02 EC2",
                          "hostname": socket.gethostname(),
                          "path": self.path,
                      }

                  data = json.dumps(body).encode("utf-8")

                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /etc/systemd/system/lab02-web.service << 'EOF'
          [Unit]
          Description=Lab02 Web Application
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/lab02/server.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

          EOF
          systemctl daemon-reload
          systemctl enable --now lab02-web
