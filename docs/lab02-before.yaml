      LaunchTemplate:
        LaunchTemplateName: Lab02StackWebInstanceLaunchTemplate5D6B8BCB
        Version:
          Fn::GetAtt:
            - WebInstanceLaunchTemplateBF096E66
            - LatestVersionNumber
      SecurityGroupIds:
        - Fn::GetAtt:
            - AppSecurityGroupC396D536
            - GroupId
