name: Lab04 CI and Deploy

on:
  push:
    paths:
      - 'labs/lab04/**'
      - '.github/workflows/lab04.yml'
  pull_request:
    paths:
      - 'labs/lab04/**'
      - '.github/workflows/lab04.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/lab04
    env:
      CDK_DEFAULT_ACCOUNT: '111111111111'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            labs/lab04/requirements.txt
            labs/lab04/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm install --global aws-cdk@2.1148.1
      - name: Run tests
        run: python -m pytest tests -q
      - name: Synthesize without AWS access
        run: cdk synth --no-lookups --quiet

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/lab04' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: lab04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: labs/lab04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo '::error::Set lab04 environment variable AWS_ROLE_ARN'; exit 1; }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo '::error::Set lab04 environment variable AWS_ACCOUNT_ID (12 digits)'; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --global aws-cdk@2.1148.1
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: GitHub-Lab04
      - name: Show infrastructure changes
        run: cdk diff --all --no-lookups --change-set=false
      - name: Deploy Lab04 only
        run: cdk deploy --all --no-lookups --require-approval never
