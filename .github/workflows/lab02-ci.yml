name: Lab02 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lab02 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: labs/lab02

    env:
      ALERT_EMAIL: ci@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            labs/lab02/requirements.txt
            labs/lab02/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Pyhon dependencies
        run: |
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Install CDK CLI
        run: npm install --global aws-cdk@2

      - name: Run tests
        run: python -m pytest tests -q

      - name: Synthesize CloudFormation template
        run: |
          cdk synth Lab02Stack \
            --no-lookups \
            -c allowedIpv4=192.0.2.1/32 \
            --quiet